name: Publish

# Publishes to npm when a GitHub release is published. Uses npm trusted publishing (OIDC), so no NPM_TOKEN
# secret is needed: configure this repo + workflow as a trusted publisher on npmjs.com first.
on:
    release:
        types: [published]

jobs:
    publish:
        if: ${{ !github.event.release.prerelease }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - name: Check release tag matches package version
              run: |
                  node --input-type=module <<'NODE'
                  import { readFileSync } from 'node:fs';
                  const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
                  if (process.env.GITHUB_REF_NAME !== `v${version}`) {
                      throw new Error(`Release tag must be v${version}`);
                  }
                  NODE
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  cache: npm
            - run: npm install -g npm@latest
            - run: npm ci --ignore-scripts
            - run: npm audit --audit-level=high
            - run: npm run check
            - run: npm publish --provenance --access public
